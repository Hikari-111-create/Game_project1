<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallax + Player</title>
<style>
  html, body { margin:0; padding:0; background:#111; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .stage { position:relative; width:1120px; height:900px; }
  :root {
    --bg-split:60%; --bg-color:#222222;
    --rock-top:30%; --rock-left:50%; --rock-offset-x:-49.3%; --rock-offset-y:-50%;
    --sun-top:30%; --sun-left:50%; --sun-offset-x:-50%; --sun-offset-y:-30%; --sun-width:168px; --sun-height:88px;
    --layerbg-top:35.8%; --layerbg-offset-y:360px;
    --tiles-top:35.8%;
    --tiles1-offset-y:260px; --tiles2-offset-y:230px; --tiles3-offset-y:200px; --tiles4-offset-y:180px; --tiles5-offset-y:159.9px;
    --map-left:50%; --map-top:0px; --tile-size:70px;
    --alt-step:60px; --scene-h:630px; --sky-h:600px;
  }
  #bg { position:absolute; top:0; left:0; width:1120px; height:600px; background-color:var(--bg-color); background-image:url('bg.png'); background-repeat:repeat-x; background-position:top left; background-size:auto calc(var(--bg-split) + var(--alt-y, 0px)); transition:background-size .6s ease; }
  #sun { position:absolute; top:var(--sun-top); left:var(--sun-left); width:var(--sun-width); height:var(--sun-height); transform:translate(var(--sun-offset-x), var(--sun-offset-y)); pointer-events:none; }
  #canvas, #wind { position:absolute; top:0; left:0; display:block; width:1120px; height:600px; }
  #rock { position:absolute; top:var(--rock-top); left:var(--rock-left); width:1135px; height:104px; transform:translate(var(--rock-offset-x), var(--rock-offset-y)); pointer-events:none; }
/* 敵出現ゾーン用の背景: 640x480 のgifを等倍で敷き詰める */
#battleBack { position:absolute; left:0; top:0; width:1120px; height:630px; display:none; pointer-events:none; z-index:5;
  background:#000 url('enemy/battle_back.gif') repeat top left; background-size:640px 480px; image-rendering:pixelated;
  opacity:0; transition:opacity .4s ease; }
  #scene { position:absolute; left:0; top:0; width:1120px; height:900px; clip-path:inset(0 0 calc(100% - var(--scene-h)) 0); pointer-events:none; }
  #canvasTop { position:absolute; left:0; top:-600px; width:1120px; height:600px; display:block; pointer-events:none; }
  #canvasBottom { position:absolute; left:0; top:600px; width:1120px; height:300px; display:block; pointer-events:none; }
  #shift { position:absolute; left:0; top:0; width:1120px; height:900px; transform:translateY(var(--alt-y, 0px)); transition:transform .6s ease; }
  #tilemap, #tilemapFront { position:absolute; left:var(--map-left); top:var(--map-top); transform:translateX(-50%); image-rendering:pixelated; pointer-events:none; z-index:10; }
  #tilemapFront { z-index:11; }
  /* プレイヤー: 手前タイル(11)の上、風(30)の下 */
  #player { position:absolute; left:0; top:0; width:1120px; height:900px; image-rendering:pixelated; pointer-events:none; z-index:20; }
  #wind { pointer-events:none; z-index:30; }
  /* パリィ演出: #dim が全体を暗くし、#spot がプレイヤーと対象(弾/敵)だけを明るく描き直す */
  #dim { position:absolute; inset:0; background:rgba(0,0,0,.6); opacity:0; pointer-events:none; z-index:35; }
  #spot { position:absolute; left:0; top:0; width:1120px; height:900px; image-rendering:pixelated; pointer-events:none; z-index:40; }
  /* マップ移動用の暗転 */
  #fade { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:50; transition:opacity .12s ease; }
  .pad { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; align-items:center; gap:4px; font:12px sans-serif; color:#fff; }
  .pad .file-btn { background:rgba(0,0,0,.6); color:#fff; border:1px solid #888; padding:4px 10px; cursor:pointer; font:inherit; }
  #mapLabel { min-width:8em; text-align:center; text-shadow:0 0 3px #000; }
  #help { position:absolute; left:8px; bottom:8px; z-index:60; font:11px sans-serif; color:#fff; text-shadow:0 0 3px #000; }
</style>
</head>
<body>
<div class="stage">
  <div id="scene">
    <div id="bg"></div>
    <div id="shift">
      <img id="sun" src="sun.gif" alt="sun">
      <canvas id="canvasTop" width="1120" height="900"></canvas>
      <canvas id="canvas" width="1120" height="900"></canvas>
      <canvas id="canvasBottom" width="1120" height="450"></canvas>
      <img id="rock" src="rock.png" alt="rock">
    </div>
  </div>
 <div id="battleBack"></div>
  <canvas id="tilemap"></canvas>
  <canvas id="tilemapFront"></canvas>
  <canvas id="player" width="1120" height="900"></canvas>
  <canvas id="wind" width="1120" height="900"></canvas>
  <div id="dim"></div>
  <canvas id="spot" width="1120" height="900"></canvas>
  <div id="fade"></div>
  <div id="help">←→ 移動 / ↑ ジャンプ / Z 攻撃 / C メニュー(ポーチ・特殊アクション) / X 盾 / H 当たり判定表示 /</div>
  <nav class="pad" aria-label="マップ情報">
    <span id="mapLabel"></span>
    <button class="file-btn" id="spawnBtn" type="button">弾幕スポーン</button>
     <label class="file-btn">マップ読み込み<input type="file" id="mapFile" accept=".txt,text/plain" hidden></label>
  </nav>
</div>
<script>
const STAGE_W = 1120, STAGE_H = 900;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const wcanvas = document.getElementById('wind');
const wctx = wcanvas.getContext('2d');

// ================= 背景レイヤー =================
const layerConfigs = [
  { src: 'layer4.png', speed: 0.15 },
  { src: 'layer3.png', speed: 0.3 },
  { src: 'layer2.png', speed: 0.6 },
  { src: 'layer1.png', speed: 0.9 },
];
const layers = layerConfigs.map(cfg => { const img = new Image(); img.src = cfg.src; return { img, speed: cfg.speed, x: 0 }; });

const LAYERBG_SIZE = { w: 320, h: 180 };
const layerBg = { img: new Image(), speed: 0.45, x: 0 };
layerBg.img.src = 'layerbg.png';
function getLayerBgTopY() {
  const rs = getComputedStyle(document.documentElement);
  return canvas.height * parseFloat(rs.getPropertyValue('--layerbg-top')) / 100 + (parseFloat(rs.getPropertyValue('--layerbg-offset-y')) || 0);
}
function drawLayerBg(dt) {
  const img = layerBg.img;
  if (!(img.complete && img.naturalWidth > 0)) return;
  layerBg.x -= layerBg.speed * dt;
  if (layerBg.x <= -LAYERBG_SIZE.w) layerBg.x += LAYERBG_SIZE.w;
  if (layerBg.x > 0) layerBg.x -= LAYERBG_SIZE.w;
  const bandTopY = getLayerBgTopY();
  ctx.save();
  ctx.translate(layerBg.x, bandTopY);
  ctx.fillStyle = ctx.createPattern(img, 'repeat');
  ctx.fillRect(-layerBg.x, 0, canvas.width + LAYERBG_SIZE.w, Math.max(LAYERBG_SIZE.h, canvas.height - bandTopY));
  ctx.restore();
}

// ================= 静止レイヤー (tiles1〜5) =================
const TILE_SIZE = { w: 320, h: 127 };
const tileConfigs = [
  { src: 'tiles5.png', offsetVar: '--tiles5-offset-y' },
  { src: 'tiles4.png', offsetVar: '--tiles4-offset-y' },
  { src: 'tiles3.png', offsetVar: '--tiles3-offset-y' },
  { src: 'tiles2.png', offsetVar: '--tiles2-offset-y' },
  { src: 'tiles1.png', offsetVar: '--tiles1-offset-y' },
];
const tiles = tileConfigs.map(cfg => { const img = new Image(); img.src = cfg.src; return { img, offsetVar: cfg.offsetVar }; });
function getTileBandTopY(v) {
  const rs = getComputedStyle(document.documentElement);
  return canvas.height * parseFloat(rs.getPropertyValue('--tiles-top')) / 100 + (parseFloat(rs.getPropertyValue(v)) || 0);
}

// ================= 風 =================
const WIND = {
  count: 2, points: 50, width: 6, pixel: 2, levels: 10,
  speed: [3, 5], life: [90, 300], yRange: [0.05, 0.6],
  startColor: [255, 255, 255], startAlpha: 0.55,
  endColor: [190, 230, 255], endAlpha: 0.0,
};
function rand(a, b) { return a + Math.random() * (b - a); }
function createWind(initial) {
  const baseY = canvas.height * rand(WIND.yRange[0], WIND.yRange[1]);
  return {
    x: initial ? rand(0, canvas.width) : -rand(0, 150), y: baseY, baseY,
    vx: rand(WIND.speed[0], WIND.speed[1]),
    amp: rand(8, 30), freq: rand(0.03, 0.08), phase: rand(0, Math.PI * 2),
    life: rand(WIND.life[0], WIND.life[1]), t: 0, acc: 0, points: [],
  };
}
const windStreaks = Array.from({ length: WIND.count }, () => createWind(true));
function stepWind(s) {
  s.life--; s.t++; s.x += s.vx;
  s.y = s.baseY + Math.sin(s.t * s.freq + s.phase) * s.amp;
  s.points.unshift({ x: s.x, y: s.y });
  if (s.points.length > WIND.points) s.points.pop();
}
function drawWind(s) {
  const pts = s.points, n = pts.length;
  if (n < 2) return;
  const PX = WIND.pixel;
  const fade = Math.min(0, s.life / 10);
  const lifeScale = s.life < 14 ? Math.max(0, s.life / 14) : 1;
  const cells = new Map();
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[i], p1 = pts[i + 1];
    const dx = p1.x - p0.x, dy = p1.y - p0.y;
    const len = Math.hypot(dx, dy) || 1;
    const sidex = -dy / len, sidey = dx / len;
    const steps = Math.max(1, Math.ceil(len / (PX / 2)));
    for (let k = 0; k < steps; k++) {
      const f = k / steps, prog = (i + f) / (n - 1);
      const qprog = Math.floor(prog * WIND.levels) / WIND.levels;
      const alpha = Math.min(1, Math.max(0, WIND.startAlpha + (WIND.endAlpha - WIND.startAlpha) * qprog + fade));
      if (alpha <= 0) continue;
      const cx = p0.x + dx * f, cy = p0.y + dy * f;
      const size = Math.sin(prog * Math.PI) * WIND.width * lifeScale;
      const col = WIND.startColor.map((c, j) => Math.round(c + (WIND.endColor[j] - c) * qprog));
      for (let w = -size; w <= size + 0.001; w += PX / 2) {
        const gx = Math.floor((cx + sidex * w) / PX), gy = Math.floor((cy + sidey * w) / PX);
        const key = gx + ',' + gy, old = cells.get(key);
        if (!old || old.a < alpha) cells.set(key, { gx, gy, a: alpha, c: col });
      }
    }
  }
  for (const c of cells.values()) {
    wctx.fillStyle = `rgba(${c.c[0]},${c.c[1]},${c.c[2]},${c.a})`;
    wctx.fillRect(c.gx * PX, c.gy * PX, PX, PX);
  }
}
function updateAndDrawWind(dt) {
  for (let k = 0; k < windStreaks.length; k++) {
    let s = windStreaks[k];
    s.acc += Math.min(dt, 3);
    while (s.acc >= 1) { s.acc -= 1; stepWind(s); }
    const tail = s.points[s.points.length - 1];
    if (s.life < -10 || (tail && tail.x > canvas.width + 50)) s = windStreaks[k] = createWind(false);
    drawWind(s);
  }
}

// ================= タイルマップ (world.txt) =================
const TILE = 40;
const tileDisp = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-size')) || TILE;
const TILE_COUNT = 242;
const TILE_SRC = n => `tile/tile${String(n).padStart(3, '0')}.png`;
const tmap = document.getElementById('tilemap');
const tctx = tmap.getContext('2d');
const tmapFront = document.getElementById('tilemapFront');
const tfctx = tmapFront.getContext('2d');
const labelEl = document.getElementById('mapLabel');
const stageEl = document.querySelector('.stage');
let maps = {}, fronts = {}, byPos = {}, curName = 'center', worldReady = false;
let zones = {}, zoneRt = null;
let ITEMS = [];   // world.txt の [itemlist:...] で定義される回復アイテム一覧 { name, desc, heal }
const zoneQueue = ph => ph.flatMap(p => Array(p.n).fill(p.type));
function zoneLocked() {   // ゾーン内に敵がいる/フェーズが残っている間は移動不可
  if (!zoneRt || zoneRt.name !== curName) return false;
  return !zoneRt.done || enemies.some(e => e.map === curName && e.state !== 'dead');
}
function updateZone() {
  const z = zoneRt;
  if (!z || z.name !== curName || z.done) return;
  if (z.pending.length) {                         // 1フレームに1体ずつ出現(位置が取れなければ次フレームに再試行)
    const en = spawnEnemy(z.pending[0]);
    if (en) { en.zone = true; z.pending.shift(); sfx('enemy_appear'); }
    return;
  }
  if (enemies.some(e => e.zone && e.map === curName && e.state !== 'dead')) return;
  if (++z.idx >= z.phases.length) { z.done = true; sfx('enemy_clear'); spawnChest(); return; }
  z.pending = zoneQueue(z.phases[z.idx]);
}
const tileImgs = {};

function nameToPos(name) {
  let x = 0, y = 0;
  for (const m of name.matchAll(/(left|right|up|down)(\d+)/g)) {
    const k = +m[2];
    if (m[1] === 'left') x -= k; else if (m[1] === 'right') x += k;
    else if (m[1] === 'up') y -= k; else y += k;
  }
  return [x, y];
}
// 現在のマップから見て (dx,dy) 方向に隣のマップがあればその名前を返す
function neighbor(dx, dy) {
 if (zoneLocked()) return null;
  const [x, y] = nameToPos(curName);
  return byPos[(x + dx) + ',' + (y + dy)] || null;
}
function parsePhase(s) {
  const list = [];
  for (const part of s.split(',')) {
    const m = /^enemy_(book|knife|fist)=(\d+)$/i.exec(part.trim());
    if (m && +m[2] > 0) list.push({ type: m[1].toLowerCase(), n: +m[2] });
  }
  return list;
}
// [itemlist:{name=item1,D=説明,healhp=30},{...}]  ('D＝' のように全角の＝でも可)
function parseItems(s) {
  const list = [];
  for (const m of s.matchAll(/\{([^{}]*)\}/g)) {
    const it = { name: '', desc: '', heal: 0, healtp: 0, defRate: 1, defT: 0, atk: 0, atkT: 0 };
    for (const part of m[1].split(/,(?=\s*(?:name|d|healhp|heal|healtp|tp|def|deft|atk|atkt)\s*[=＝])/i)) {
      const k = /^\s*([A-Za-z]+)\s*[=＝]\s*([\s\S]*?)\s*$/.exec(part);
      if (!k) continue;
      const key = k[1].toLowerCase(), v = k[2], n = Number(v);
      if (key === 'name') it.name = v;
      else if (key === 'd') it.desc = v;
      else if (key === 'healhp' || key === 'heal') it.heal = n || 0;
      else if (key === 'healtp' || key === 'tp') it.healtp = Math.max(0, n || 0);
      else if (key === 'def') it.defRate = isFinite(n) && n >= 0 ? n : 1;
      else if (key === 'deft') it.defT = Math.max(0, n || 0);
      else if (key === 'atk') it.atk = Math.max(0, n || 0);
      else if (key === 'atkt') it.atkT = Math.max(0, n || 0);
    }
    if (it.name) list.push(it);
  }
  return list;
}
function parseWorld(text) {
  const out = { back: {}, front: {}, zones: {}, items: null }; let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (line.startsWith(';')) continue;
    const im = /^\[itemlist\s*:(.*)\]$/i.exec(line);
    if (im) { out.items = parseItems(im[1]); continue; }   // アイテム定義行(マップの行には混ぜない)
    const hm = line.match(/^\[map\.(.+)\]$/i);
    if (hm) {
      const toks = hm[1].trim().split(/\s+/);
      let name = toks[0], front = false, ended = false, hasPhase = false;
      const phases = [];
      for (let i = 1; i < toks.length; i++) {
        const t = toks[i];
        if (/^to$/i.test(t)) name = toks[++i] || name;
        else if (/^infrontlayer$/i.test(t)) front = true;
        else if (/^phase=end$/i.test(t)) { ended = true; hasPhase = true; }
        else {
          const pm = /^phase([1-3]):(.*)$/i.exec(t);
          if (pm) { hasPhase = true; const p = parsePhase(pm[2]); if (p.length) phases[+pm[1] - 1] = p; }
        }
      }
      const target = front ? out.front : out.back;
      cur = (hasPhase && target[name]) || (target[name] = []);   // フェーズ指定行は既存マップを上書きしない
      const list = phases.filter(Boolean);
      if (ended && list.length) out.zones[name] = list.slice(0, 3);   // end が無いとゾーン無効
      continue;
    }
    if (cur && line) cur.push(line.split(/[\s,]+/));
  }
  for (const k of Object.keys(out.back))  if (!out.back[k].length)  delete out.back[k];   // タイル無しの行は捨てる
  for (const k of Object.keys(out.front)) if (!out.front[k].length) delete out.front[k];
  return out;
}
function loadWorld(text) {
  const w = parseWorld(text); maps = w.back; fronts = w.front; zones = w.zones; byPos = {};
chests.length = 0;
  ITEMS = w.items || [];
  for (let i = pouch.length - 1; i >= 0; i--) if (!ITEMS[pouch[i]]) pouch.splice(i, 1);   // 定義が無くなったアイテムは除去
  for (let i = drops.length - 1; i >= 0; i--) if (!ITEMS[drops[i].id]) drops.splice(i, 1);
  const names = new Set([...Object.keys(maps), ...Object.keys(fronts)]);
  for (const n of names) byPos[nameToPos(n).join(',')] = n;
  goTo(names.has('center') ? 'center' : [...names][0]);
  worldReady = true;
}
function tileImg(n) {
  if (!tileImgs[n]) { const i = new Image(); i.onload = drawMap; i.src = TILE_SRC(n); tileImgs[n] = i; }
  return tileImgs[n];
}
function parseTok(tok) {
  if (/^a$/i.test(tok)) return null;
  const m = /^(\d+)([rv]*)$/i.exec(tok);
  if (!m || +m[1] > TILE_COUNT) return null;
  const fl = m[2].toLowerCase();
  return { n: +m[1], fx: fl.includes('r'), fy: fl.includes('v') };
}
function drawLayer(cv, cx, rows) {
  if (!rows) { cv.style.display = 'none'; return; }
  cv.style.display = '';
  const cols = Math.max(...rows.map(r => r.length));
  cv.width = cols * TILE; cv.height = rows.length * TILE;
  cv.style.width = cols * tileDisp() + 'px';
  cv.style.height = rows.length * tileDisp() + 'px';
  rows.forEach((row, y) => row.forEach((tok, x) => {
    const t = parseTok(tok); if (!t) return;
    const im = tileImg(t.n);
    if (im.complete && im.naturalWidth) {
      cx.save();
      cx.translate(x * TILE + (t.fx ? TILE : 0), y * TILE + (t.fy ? TILE : 0));
      cx.scale(t.fx ? -1 : 1, t.fy ? -1 : 1);
      cx.drawImage(im, 0, 0, TILE, TILE);
      cx.restore();
    }
  }));
}
function drawMap() {
  drawLayer(tmap, tctx, maps[curName]);
  drawLayer(tmapFront, tfctx, fronts[curName]);
}

// ---- 当たり判定: 手前レイヤー(infrontlayer)のタイルだけが固い ----
const sol = { g: [], ox: 0, oy: 0, T: 70 };
// 指定マップの当たり判定グリッドと配置オフセットを計算(DOM計測なし)
function solidFor(name) {
  const T = tileDisp(), rows = fronts[name];
  if (!rows) return { g: [], ox: 0, oy: 0, T };
  const cols = Math.max(...rows.map(r => r.length));
  const cs = getComputedStyle(document.documentElement);
  const ml = cs.getPropertyValue('--map-left').trim();
  const left = ml.endsWith('%') ? STAGE_W * parseFloat(ml) / 100 : (parseFloat(ml) || 0);
  const top = parseFloat(cs.getPropertyValue('--map-top')) || 0;
  return { g: rows.map(r => r.map(tok => !!parseTok(tok))), ox: left - cols * T / 2, oy: top, T };
}
function buildSolid() { Object.assign(sol, solidFor(curName)); }

const sceneEl = document.getElementById('scene');
// ================= 敵出現ゾーン中の背景切り替え =================
const battleEl = document.getElementById('battleBack');
let battleOn = false;
const BATTLE_FADE_MS = 400;   // CSS の #battleBack transition と合わせる
let battleTimer = null;
function updateBattleBg() {
  const on = zoneLocked();            // ゾーン内に敵がいる/フェーズが残っている間
  if (on === battleOn) return;
  battleOn = on;
  clearTimeout(battleTimer);
  if (on) {
    // 出現: 通常背景は即座に隠し、バトル背景を display → 次フレームで opacity 1
    battleEl.style.display = 'block';
    sceneEl.style.display = 'none';
    tmap.style.visibility = 'hidden';
    wcanvas.style.visibility = 'hidden';
    void battleEl.offsetWidth;        // display 切り替え直後に強制リフロー(transition を効かせる)
    battleEl.style.opacity = 1;
  } else {
    // 終了: 通常背景を戻したうえで、バトル背景を上からフェードアウト
    sceneEl.style.display = '';
    tmap.style.visibility = '';
    wcanvas.style.visibility = '';
    battleEl.style.opacity = 0;
    battleTimer = setTimeout(() => {
      if (!battleOn) battleEl.style.display = 'none';
    }, BATTLE_FADE_MS);
  }
}
function updateAltitude() {
  const cs = getComputedStyle(document.documentElement);
  const num = v => parseFloat(cs.getPropertyValue(v)) || 0;
  const sunTop = stageEl.offsetHeight * num('--sun-top') / 100 + num('--sun-height') * num('--sun-offset-y') / 100;
  const maxShift = num('--sky-h') - sunTop + 2;
  const up = Math.max(0, -nameToPos(curName)[1]);
  sceneEl.style.setProperty('--alt-y', Math.min(up * num('--alt-step'), maxShift) + 'px');
}
function goTo(name) {
  if (!maps[name] && !fronts[name]) return;
  curName = name; labelEl.textContent = 'map.' + name;
const zp = zones[name];

      else { P.state = 'idle'; setAnim('idles'); }

    case 'attack': {

      if (P.frame < end) P.frame++;

// 画面端の処理
//  ・隣のマップがあれば暗転して反対側から出現(出現位置が壁で埋まっていたら移動不可)
//  ・隣のマップが無い方向は透明な壁(左右は位置クランプ、上下は moveY の天井/床)
function checkEdges() {
  const hw = hbW() / 2, hh = hbH();
  let n = null, nx = P.x, ny = P.y, up = false;
  if (edgeLock <= 0) {
    if (P.x < 0 && (n = neighbor(-1, 0))) nx = P.x + STAGE_W;
    else if (P.x > STAGE_W && (n = neighbor(1, 0))) nx = P.x - STAGE_W;
    else if (P.y - hh > STAGE_H && (n = neighbor(0, 1))) ny = P.y - STAGE_H;
    else if (P.y < 0 && P.vy < 0 && (n = neighbor(0, -1))) { ny = P.y + STAGE_H; up = true; }
  }
  if (n) {
    nx = Math.max(hw, Math.min(STAGE_W - hw, nx));
    const sn = solidFor(n);
    // 上へ移動する時は少し浮上させる(塞がれていたら持ち上げなし)
    if (up && !boxHit(nx, ny - CONFIG.upLift, sn)) ny -= CONFIG.upLift;
    if (!boxHit(nx, ny, sn)) {                    // 出現位置が空いている時だけ移動
      transitionTo(n, () => {
        P.x = nx; P.y = ny;
        if (up) P.vy = Math.min(P.vy, -CONFIG.upBoost);   // 上向きの勢いを確保

      return;
    }

  }
  const openL = !n && neighbor(-1, 0), openR = !n && neighbor(1, 0);
  P.x = Math.max(openL ? -Infinity : hw, Math.min(openR ? Infinity : STAGE_W - hw, P.x));
  if (P.y < 0 && P.vy < 0 && neighbor(0, -1)) { P.y = 0; P.vy = 0; }
  if (P.y - hh > STAGE_H + 300) spawn();
}

function update(dt) {
  const dir = inputDir();
  if (P.airFreeze > 0) {              // ジャンプ斬りパリィ演出中は全て停止
    P.airFreeze -= dt;
    if (P.airFreeze <= 0) {
      P.airFreeze = 0;
      if (P.lungeDmg != null) {   // 溜め突進の命中
        const t = P.target, n = P.lungeDmg; P.lungeDmg = null;
        if (t && enemies.includes(t) && t.state !== 'dead') {
          fx.push({ k: 'slash', x: t.x, y: t.y, t: 0, d: 0.3 });
          if (enemyHittable(t)) hitEnemy(t, n); else slashEnemy(t, n);
          sfx('ultra_swing');
        }
        P.vy = -300; P.invT = 0.3;
      } else resolveParry(P.target, ATTACK.airBonus, 'air');
      P.target = null; if (P.invT < SHIELD.invincible) P.invT = SHIELD.invincible;
    }
    return;
  }
  if (edgeLock > 0) edgeLock -= dt;
  if (combo.cooldown > 0) combo.cooldown = Math.max(0, combo.cooldown - dt);
  if (P.invT > 0) P.invT = Math.max(0, P.invT - dt);
  if (P.boostT > 0) P.boostT = Math.max(0, P.boostT - dt);   // パリィ後の加速
  if (combo.keepTimer > 0) { combo.keepTimer -= dt; if (combo.keepTimer <= 0) { combo.keepTimer = 0; combo.stage = 0; } }

  if (ui.showT > 0) ui.showT = Math.max(0, ui.showT - dt);
  const showUI = ui.on || ui.showT > 0;
  ui.alpha += ((showUI ? 1 : 0) - ui.alpha) * Math.min(1, dt * 12);   // ゲージの表示
  ui.dim   += ((ui.on ? 1 : 0)  - ui.dim)   * Math.min(1, dt * 12);   // 暗転は C キーのときだけ
  tickHpUi(dt);   // ダメージの白い残像 + 回復のハイライト

  // ---- TPゲージ ----
  if (ui.tpShowT > 0) ui.tpShowT = Math.max(0, ui.tpShowT - dt);
  ui.tpAlpha += (((ui.on || ui.tpShowT > 0) ? 1 : 0) - ui.tpAlpha) * Math.min(1, dt * 12);
  if (ui.tpShown < ui.tp) { if (ui.tpWait > 0) ui.tpWait -= dt; else ui.tpShown = Math.min(ui.tp, ui.tpShown + TP.trailSpeed * dt); }
  else ui.tpShown = ui.tp;
  ui.tpBlink += dt * TP.blinkSpeed;

  if (P.state === 'damage') {
    jumpPressed = false;
    if (P.phase === 'air') {
      moveX(Math.sign(P.kvx) * CONFIG.airKnockbackX * dt);
      P.vy += CONFIG.gravity * dt;
      if (moveY(P.vy * dt) === 'land') { P.phase = 'land'; setAnim('damage'); P.frame = 1; P.dur = 0.24; }
    } else if (P.phase === 'land' && P.dur) {
      moveX(Math.sign(P.kvx) * CONFIG.slideSpeed * Math.max(0, 1 - P.t / P.dur) * dt);
    }
    checkEdges();
    P.t += dt; stepAnim();
    return;
  }

  if (P.state === 'shield') { updateShield(dt, dir); return; }
  if (P.state === 'charge') { updateCharge(dt); return; }
  if (P.lunge) { updateLunge(dt); return; }
  if (jumpPressed) { if (onGround() && P.state !== 'attack') startJump(); jumpPressed = false; }

  if (P.state === 'idle' && dir !== 0) { P.state = 'run'; setAnim('player_run'); }
  else if (P.state === 'run' && dir === 0) { P.state = 'stop'; setAnim('player_stop'); }
  else if (P.state === 'stop' && dir !== 0) { P.state = 'run'; setAnim('player_run'); }

  const locked = P.state === 'attack' || (P.state === 'jump' && P.phase === 'land');
  if (!locked && dir !== 0) P.facing = dir;
  if (!locked && (P.state === 'run' || P.state === 'jump')) moveX(dir * moveSpd() * dt);

  // 足場が無くなったら落ちる
  if ((P.state === 'idle' || P.state === 'run' || P.state === 'stop' || P.state === 'attack') && !standing()) { P.vy = 0; startFall(); }

  if (P.state === 'jump' && P.phase === 'air') {
    P.vy += CONFIG.gravity * dt;
    if (moveY(P.vy * dt) === 'land') {
      sfx('noise');   // 着地音
      P.phase = 'land'; P.airAttack = false; attackQueued = false; airStage = 0;

  P.t += dt; stepAnim();

  if (P.state === 'jump' && P.phase === 'air' && !P.airAttack) {
    const up = P.vy < 0;
    if (up && P.frame > 4) P.frame = 2;
    if (!up && P.frame < 5) P.frame = 5;
  }
  if (attackActive()) deflectByAttack();   // 攻撃判定(弾き返し + 突進中の敵のパリィ + スタン中の敵へ斬撃)
}

    e.flipY = Math.cos(Math.PI * p); e.frame = p < 0.5 ? 2 : 0;
    if (e.pt >= F) { e.phase = 'pre'; e.pt = 0; e.flipY = -1; }
  } else if (e.phase === 'pre') {               // 12tick後に2枚目+発射
    e.frame = 0;
    if (e.pt >= ENEMY.preFireTicks * tk) { e.phase = 'post'; e.pt = 0; e.frame = 1; fireBooks(e); }
  } else if (e.phase === 'post') {
    if (e.pt >= ENEMY.postFireTicks * tk) { e.phase = 'out'; e.pt = 0; e.frame = 2; }
  } else if (e.phase === 'out') {               // 3枚目に戻りつつ0.5秒で反転を戻す
    const p = Math.min(1, e.pt / F);
    e.flipY = -Math.cos(Math.PI * p);
    if (e.pt >= F) { e.state = 'fly'; e.phase = null; e.flipY = 1; e.timer = ENEMY.attackInterval; }
  }
}
function enemyFall(e, dt) {
  const h = eH(e), T = sol.T;
  e.vy += ENEMY.gravity * dt; e.y += e.vy * dt;
  let landed = false;
  if (rectHit(e.x, e.y, eW(e), h)) { e.y = sol.oy + Math.floor((e.y + h / 2 - sol.oy - 0.001) / T) * T - h / 2; landed = true; }
  else if (hasFloor() && e.y + h / 2 > STAGE_H) { e.y = STAGE_H - h / 2; landed = true; }
  else if (e.y - h / 2 > STAGE_H) { e.state = 'dead'; return; }    // 地面が無ければ消える
  if (landed) { e.state = 'down'; e.vy = 0; e.timer = e.type === 'knife' ? KNIFE.downTime : ENEMY.downTime; e.frame = 0; }
}
function updateEnemies(dt) {
  for (const e of enemies) {
    if (e.map !== curName) continue;                // プレイヤーのいるマップでのみ動く
    e.animT = (e.animT || 0) + dt;                  // アニメ時計(パリィ演出中は updateEnemies が止まるので一緒に止まる)
    if (e.flash > 0) e.flash = Math.max(0, e.flash - dt);
    for (let i = e.ghosts.length - 1; i >= 0; i--) if ((e.ghosts[i].life -= dt) <= 0) e.ghosts.splice(i, 1);   // 残像の寿命
    if (e.state === 'spawn') {
      e.anim += dt; e.frame = 0;
      const p = Math.min(1, e.anim / ENEMY.vanishTime);
      e.flipY = Math.cos(Math.PI * 2 * ENEMY.spinTurns * p);
      if (p >= 1) { e.state = 'fly'; e.frame = 2; e.anim = 0; e.flipY = 1; }
    } else if (e.state === 'vanish') {
      e.anim += dt; e.frame = 0;
      const p = Math.min(1, e.anim / ENEMY.vanishTime);
      e.flipY = Math.cos(Math.PI * 2 * ENEMY.spinTurns * p);
      if (p >= 1) e.state = 'dead';
    } else if (e.state === 'fly') enemyFly(e, dt);
    else if (e.state === 'attack') enemyAttack(e, dt);
    else if (e.state === 'charge') enemyCharge(e, dt);
  else if (e.state === 'bounce') fistBounce(e, dt);
    else if (e.state === 'fall') enemyFall(e, dt);
    else if (e.state === 'down') {
      e.timer -= dt;
      if (e.timer <= 0) { e.state = 'fly'; e.frame = 2; e.vy = -30; e.timer = e.type === 'knife' ? KNIFE.attackInterval : ENEMY.attackInterval; }
    }
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].state === 'dead') enemies.splice(i, 1);
}
function drawEnemy(g, e) {
  const key = enemySheet(e), s = SHEETS[key], S = ENEMY.scale, dw = s.w * S, dh = s.h * S;
  for (const gh of e.ghosts) {                       // 残像(突進の溜め・突進中)
    const gk = gh.key || key, gs = SHEETS[gk], f = frameRect(gs, Math.min(gh.fr || 0, gs.frames - 1));
    g.save(); g.imageSmoothingEnabled = false;
    g.globalAlpha = 0.5 * Math.max(0, gh.life) / gh.max;
    g.translate(gh.x, gh.y); g.scale(gh.face, 1);
    g.drawImage(getImg(gk), f.sx, f.sy, gs.w, gs.h, -gs.w * S / 2, -gs.h * S / 2, gs.w * S, gs.h * S);
    g.restore();
  }
  let fr = e.frame;
  if (e.type === 'knife') fr = knifeFrame(e, key);   // ナイフは状態に関係なく常にループ
  const { sx, sy } = frameRect(s, Math.min(fr, s.frames - 1));
  g.save(); g.imageSmoothingEnabled = false;
  if (e.flash > 0 && Math.floor(e.flash * 60) % 2 === 0) g.globalAlpha = 0.4;   // 被弾時の点滅
  let kx = 1;
  if (e.state === 'spawn' || e.state === 'vanish') {
    const p = Math.min(1, e.anim / ENEMY.vanishTime);
    kx = e.state === 'spawn' ? p : 1 - p;           // 出現:細→太 / 消滅:太→細
  }
     g.translate(e.x, e.y);
   const rot = e.type === 'fist' && (e.state === 'bounce' || e.state === 'charge');
  if (rot) g.rotate(e.ang);                                   // 右向き画像を飛んでいく角度に回す
  g.scale((rot ? 1 : enemyFace(e)) * Math.max(kx, 0.02), Math.abs(e.flipY) < 0.02 ? 0.02 : e.flipY);
  g.drawImage(getImg(key), sx, sy, s.w, s.h, -dw / 2, -dh / 2, dw, dh);
  g.restore();
  // parry(本体)の上に spin を重ねて、1秒かけて消す
  if (e.type === 'knife' && e.state === 'charge' && e.phase === 'spin') {
    const p = Math.min(1, e.anim / ENEMY.vanishTime);
    const im = getImg('enemy_knife_spin');
    const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;   // 画像の実サイズで描く
    const fy = Math.cos(Math.PI * 2 * ENEMY.spinTurns * p);                       // 上下回転
    g.save(); g.imageSmoothingEnabled = false;
    if (e.flash > 0 && Math.floor(e.flash * 60) % 2 === 0) g.globalAlpha = 0.4;
    g.translate(e.x, e.y);
    g.scale(enemyFace(e, 'enemy_knife_spin') * Math.max(1 - p, 0.02), Math.abs(fy) < 0.02 ? 0.02 : fy);   // 横幅は太→細
    g.drawImage(im, 0, 0, iw, ih, -iw * S / 2, -ih * S / 2, iw * S, ih * S);
    g.restore();
  }

  if (e.hp < e.maxHp && e.state !== 'vanish' && e.state !== 'spawn') {
    g.fillStyle = '#000a'; g.fillRect(e.x - 31, e.y - dh / 2 - 12, 62, 7);
    g.fillStyle = '#ff5060'; g.fillRect(e.x - 30, e.y - dh / 2 - 11, 60 * Math.max(0, e.hp) / e.maxHp, 5);
  }
  if (debug) { const r = enemyRect(e); g.strokeStyle = '#ffd000'; g.strokeRect(r.x, r.y, r.w, r.h); }
}
function drawEnemies(g) {
  for (const e of enemies) if (e.map === curName && e.state !== 'dead') drawEnemy(g, e);
}

// ---- 弾の挙動 / 弾き返し ----
function bookMotion(b, dt) {   // 1秒上昇(減速・プレイヤー方向へ少し寄る)→下降(加速)
  b.age += dt;
  if (b.age < ENEMY.rise) {
    b.vy = -ENEMY.riseSpeed * (1 - b.age / ENEMY.rise);
    b.vx += Math.sign(P.x - b.x) * ENEMY.homing * dt;
  } else b.vy = Math.min(ENEMY.maxFall, (b.age - ENEMY.rise) * ENEMY.fallAccel);
}
// ---- ナイフ(敵2の弾) ----
function spawnKnives(e) {   // プレイヤーの「真横〜上」にだけ出す(予告線つき・1秒後に発射)
  const cx = P.x, cy = P.y - hbH() / 2;
  for (let i = 0; i < KNIFE.count; i++) {
    let x = cx, y = cy;
    for (let k = 0; k < 30; k++) {
      const a = rand(Math.PI, Math.PI * 2), d = rand(KNIFE.ringMin, KNIFE.ringMax);   // 上半分のみ
      x = cx + Math.cos(a) * d; y = cy + Math.sin(a) * d;
      if (x > 30 && x < STAGE_W - 30 && y > 30 && y < STAGE_H - 30) break;
    }
    x = Math.max(30, Math.min(STAGE_W - 30, x));
    y = Math.min(cy, Math.max(30, y));   // 念のため: プレイヤーの胴体中心より下には出さない
    bullets.push({ kind: 'knife', x, y, vx: 0, vy: 0, r: KNIFE.r, dmg: KNIFE.dmg, reflected: false,
      age: 0, aim: true, shieldOnly: true, owner: e, ang: Math.atan2(cy - y, cx - x) });
  }
}
function knifeMotion(b, dt) {
  b.age += dt;
  if (!b.aim) return;
  if (b.age < KNIFE.warn - KNIFE.lockTime) b.ang = Math.atan2((P.y - hbH() / 2) - b.y, P.x - b.x);   // 発射直前まで追従
  if (b.age >= KNIFE.warn) { b.aim = false; b.vx = Math.cos(b.ang) * KNIFE.speed; b.vy = Math.sin(b.ang) * KNIFE.speed; }
}
function reflectBullet(b, bonus = 0) {
  b.reflected = true; b.dmg = (b.kind === 'knife' ? KNIFE.reflectDmg : ENEMY.reflectDmg) + bonus;
  let best = null, bd = Infinity;
  for (const e of enemies) {
    if (e.map !== curName || !enemyHittable(e)) continue;
    const d = Math.hypot(e.x - b.x, e.y - b.y); if (d < bd) { bd = d; best = e; }
  }
  if ((b.kind === 'book' || b.kind === 'knife') && best) {
    const dx = best.x - b.x, dy = best.y - b.y, len = Math.hypot(dx, dy) || 1;
    b.vx = dx / len * ENEMY.reflectSpeed; b.vy = dy / len * ENEMY.reflectSpeed;
  } else { b.vx = -b.vx; b.vy = -b.vy; }
}
function attackActive() {
  if (P.state === 'attack' && P.sheet === 'attack') {
    const r = ATTACK.active[combo.stage - 1]; return !!r && P.frame >= r[0] && P.frame <= r[1];
  }
  if (P.airAttack && P.sheet === 'jumpsword') {
    const r = ATTACK.airActive[airStage - 1];
    return !!r && P.frame >= r[0] && P.frame <= r[1];
  }
  return false;
}
function attackZone() {
  if (P.airAttack) {   // ジャンプ攻撃: ヒットボックス中心から全方向に拡大
    const w = hbW() * ATTACK.airScale, h = hbH() * ATTACK.airScale;
    return { x: P.x - w / 2, y: P.y - hbH() / 2 - h / 2, w, h };
  }
  const w = hbW() * ATTACK.reach, h = hbH() * ATTACK.up;
  return { x: P.facing >= 0 ? P.x : P.x - w, y: P.y - h, w, h };
}
function deflectByAttack() {
  const z = attackZone(), bonus = (P.airAttack ? ATTACK.airBonus : 0) + atkBonus();
  // 突進中の敵、およびこちらへ向かってくるフィスト(ナイフ本体は盾のみなので除外)
  const dashers = enemies.filter(e => ((chargeDashing(e) && e.type !== 'knife') || fistIncoming(e)) && rectOverlap(z, enemyRect(e)));
  if (P.airAttack) {
    // 範囲内で最も近い弾/突進中の敵/フィストをパリィ対象にする
    const cx = P.x, cy = P.y - hbH() / 2;
    let target = null, bd = Infinity;
    for (const b of bullets) {
      if (b.reflected || b.shieldOnly || !circleRect(b, z)) continue;
      const d = Math.hypot(b.x - cx, b.y - cy);
      if (d < bd) { bd = d; target = b; }
    }
    for (const e of dashers) {
      const d = Math.hypot(e.x - cx, e.y - cy);
      if (d < bd) { bd = d; target = e; }
    }
    if (target) {
      P.target = target; P.airFreeze = SHIELD.parryFreeze;
      parryFx(target.x, target.y, 'air');
      // 同時に範囲内にいた他の弾・敵は即処理
     for (const b of bullets) if (b !== target && !b.reflected && !b.shieldOnly && circleRect(b, z)) reflectBullet(b, bonus);
for (const e of dashers) if (e !== target) parryAny(e, bonus);
    }
  } else {
    let n = 0;   // 地上の剣パリィ成功数(1回でもTP加算)
    for (const b of bullets) if (!b.reflected && !b.shieldOnly && circleRect(b, z)) { reflectBullet(b, bonus); n++; }
    for (const e of dashers) { parryAny(e, bonus); n++; }
    if (n) gainTp(TP.gainSword);
  }
  // 剣が当たったフィストは反対方向へ跳ね返る(1振り1回)
  for (const e of enemies) {
    if (e.type !== 'fist' || e.map !== curName || e.swing === swingId) continue;
    if ((e.state === 'fly' || e.state === 'bounce') && rectOverlap(z, enemyRect(e))) {
      e.swing = swingId; hitFist(e, ENEMY.swordDmg + bonus);
    }
  }
  // スタン中(落下・倒れ中)の敵への斬撃
  for (const e of enemies) {
    if (e.map !== curName || !enemyStunned(e) || e.swing === swingId) continue;
   if (rectOverlap(z, enemyRect(e))) { e.swing = swingId; slashEnemy(e, ENEMY.swordDmg + bonus); }
  }
}
// ---- パリィ演出(プレイヤーと対象の弾/敵だけ明るく) ----
const dimEl = document.getElementById('dim');
const spotCv = document.getElementById('spot'), sg = spotCv.getContext('2d');
function drawSprite(g) {
  const s = SHEETS[P.sheet], f = Math.min(P.frame, s.frames - 1), { sx, sy } = frameRect(s, f);
  const dw = s.w * CONFIG.scale, dh = s.h * CONFIG.scale, A = imageAnchor();
  g.save();
  g.translate(A.cx, A.bottom);
  g.scale(P.facing < 0 ? -1 : 1, 1);
  g.drawImage(getImg(P.sheet), sx, sy, s.w, s.h, -dw / 2, -dh, dw, dh);
  g.restore();
}
function drawSpot() {
  sg.clearRect(0, 0, spotCv.width, spotCv.height);
  const on = isFrozen();
  dimEl.style.opacity = on ? 1 : 0;
  if (!on || !imagesReady) return;
  sg.imageSmoothingEnabled = false;
  drawFx(sg);                      // ← 追加(暗転の上にエフェクトを描く)
  drawSprite(sg);
  if (P.target && bullets.includes(P.target)) drawBullet(sg, P.target, true);
  if (P.target && enemies.includes(P.target)) drawEnemy(sg, P.target);
}
document.getElementById('spawnBtn').addEventListener('click', e => { spawnBullet(); e.currentTarget.blur(); });

// ================= 背景の描画 =================
function drawScrollingLayer(layer, dt) {
  const img = layer.img;
  if (!(img.complete && img.naturalWidth > 0)) return;
  const scale = canvas.height / img.naturalHeight, w = img.naturalWidth * scale, h = canvas.height;
  layer.x -= layer.speed * dt;
  if (layer.x <= -w) layer.x += w;
  if (layer.x > 0) layer.x -= w;
  for (let x = layer.x; x < canvas.width; x += w) ctx.drawImage(img, x, 0, w, h);
}
const topCanvas = document.getElementById('canvasTop'), topCtx = topCanvas.getContext('2d');
const botCanvas = document.getElementById('canvasBottom'), botCtx = botCanvas.getContext('2d');
function drawLayerBgBottom() {
  const img = layerBg.img;
  if (!(img.complete && img.naturalWidth > 0)) return;
  const W = botCanvas.width, H = botCanvas.height, th = LAYERBG_SIZE.h;
  const off = (((canvas.height - getLayerBgTopY()) % th) + th) % th;
  botCtx.setTransform(1, 0, 0, 1, 0, 0);
  botCtx.clearRect(0, 0, W, H);
  botCtx.translate(layerBg.x, -off);
  botCtx.fillStyle = botCtx.createPattern(img, 'repeat');
  botCtx.fillRect(-layerBg.x, off, W + LAYERBG_SIZE.w, H);
}
function drawFlippedLayers() {
  const W = topCanvas.width, H = topCanvas.height;
  topCtx.setTransform(1, 0, 0, 1, 0, 0);
  topCtx.clearRect(0, 0, W, H);
  topCtx.setTransform(1, 0, 0, -1, 0, H);
  for (const layer of layers) {
    const img = layer.img;
    if (!(img.complete && img.naturalWidth > 0)) continue;
    const w = img.naturalWidth * (H / img.naturalHeight);
    for (let x = layer.x; x < W; x += w) {
      topCtx.save(); topCtx.translate(x + w, 0); topCtx.scale(-1, 1);
      topCtx.drawImage(img, 0, 0, w, H); topCtx.restore();
    }
  }
}
function drawTileBand(tile, bandTopY) {
  const img = tile.img;
  if (!(img.complete && img.naturalWidth > 0)) return;
  ctx.save(); ctx.translate(0, bandTopY);
  ctx.fillStyle = ctx.createPattern(img, 'repeat-x');
  ctx.fillRect(0, 0, canvas.width, TILE_SIZE.h);
  ctx.restore();
}

// ================= メインループ =================
let lastTime = performance.now();
function render(time) {
  requestAnimationFrame(render);                       // 先に次フレームを予約
  const interval = CONFIG.fpsLimit > 0 ? 1000 / CONFIG.fpsLimit : 0;
  const elapsed = time - lastTime;
  if (elapsed < interval - 1) return;                  // まだ早いのでスキップ（-1ms は誤差の許容）
  lastTime = interval ? time - (elapsed % interval) : time;   // 余りを持ち越して平均FPSを保つ

  const dt = Math.min(0.05, elapsed / 1000);
  const dt60 = dt * 60;
  const dtw = (isFrozen() || pz.on) ? 0 : dt60;                   // パリィ演出中は背景・風を止める
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const layer of layers) drawScrollingLayer(layer, dtw);
  drawFlippedLayers();
  const tiles5 = tiles.find(t => t.img.src.endsWith('tiles5.png'));
  drawTileBand(tiles5, getTileBandTopY(tiles5.offsetVar));
  drawLayerBg(dtw);
  drawLayerBgBottom();
  for (const tile of tiles) { if (tile !== tiles5) drawTileBand(tile, getTileBandTopY(tile.offsetVar)); }
  wctx.clearRect(0, 0, wcanvas.width, wcanvas.height);
  updateAndDrawWind(dtw);
  if (imagesReady && worldReady && !transitioning) { if (pz.on) pauseTick(dt); else { tickSkills(dt); update(dt); if (!isFrozen()) { updateZone(); updateEnemies(dt); updateBullets(dt); updateDrops(dt); updateChests(dt); } } }
  if (!transitioning && fadeEl.style.opacity !== '0') fadeEl.style.opacity = 0;   // 暗転の取り残し防止
updateBattleBg();
  drawPlayer();
}
requestAnimationFrame(render);
</script>
